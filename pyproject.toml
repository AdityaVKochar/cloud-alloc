[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudalloc"
version = "0.1.0"
description = "Predictive CPU and memory allocation research prototype"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1,<4",
  "Flask-Migrate>=4.1,<5",
  "Flask-SQLAlchemy>=3.1,<4",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "click>=8.1,<9",
  "joblib>=1.4,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "plotly>=6.0,<7",
  "psycopg[binary]>=3.2,<4",
  "pyarrow>=18,<24",
  "python-dotenv>=1.0,<2",
  "scikit-learn>=1.6,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
]

[tool.setuptools.packages.find]
include = ["cloudalloc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
