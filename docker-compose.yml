services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cloudalloc
      POSTGRES_USER: cloudalloc
      POSTGRES_PASSWORD: cloudalloc
    ports:
      - "5432:5432"
    volumes:
      - cloudalloc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudalloc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cloudalloc_pgdata:

